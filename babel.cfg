# Woraus Babel die Texte zieht. _() ist das uebliche Schluesselwort;
# _f() ist unseres fuer Saetze mit eingesetzten Werten (siehe skyrelay_i18n.py).
#
# Bewusst nur die eigenen Dateien im Wurzelverzeichnis - ohne diese Einengung
# durchsucht Babel auch venv/ und zieht die Texte fremder Pakete mit herein.
[python: skyrelay*.py]
